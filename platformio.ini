[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; app grande (o libssh ocupa bastante flash) + ~900 KB para a lista
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    ewpa/LibSSH-ESP32 @ ^5.9.0
    bodmer/TFT_eSPI @ ^2.5.43

; Tela da CYD (ESP32-2432S028, 2.8" ILI9341) - configura o TFT_eSPI sem mexer na biblioteca
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
